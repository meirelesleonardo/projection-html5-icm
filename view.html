<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>View - Projection HTML5</title>
  <link rel="stylesheet" href="css/reveal.css">
  <link rel="stylesheet" href="css/theme/icm.css" id="theme">
  <link rel="stylesheet" href="css/view.css">
  <link rel="stylesheet" href="css/view-remote.css">
</head>
<body>
  <div id="pairingOverlay">
    <h1>Projeção ICM</h1>
    <p class="hint">Conecte o celular ao mesmo hotspot e escaneie o QR</p>
    <img class="qr" id="pairingQr" alt="QR de pareamento">
    <div class="ip" id="pairingIp">…</div>
    <div class="pin" id="pairingPin"></div>
    <p class="hint" id="pairingHost"></p>
  </div>
  <div id="remoteVideoLayer">
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div id="connDot" class="off" title="WebSocket"></div>

  <div class="reveal">
    <header class="winetitle"><div id="titulo"></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>
    <header class="winetitle2"><div id="titulo"><br></div><div id="logo" style="background-color:white"><i class="icon-logo_bold"></i></div></header>
    <header class="whitelogo"><div id="logo" style="float:right"><i class="icon-logo_bold_white"></i></div></header>
    <header class="backlay1-pt-br"><div class="backlay_1-pt-br"><i class="logo_tela_padrao icon-logo_bold_white"></i></div></header>

    <header class="winetitle-en"><div id="titulo"></div><div id="logo" style="background-color:white"><i class="icon-logo_usa"></i></div></header>
    <header class="winetitle2-en"><div id="titulo"><br></div><div id="logo" style="background-color:white"><i class="icon-logo_usa"></i></div></header>
    <header class="whitelogo-en"><div id="logo" style="float:right"><i class="icon-logo_usa_white"></i></div></header>
    <header class="backlay1-en"><div class="backlay_1-en"><i class="logo_tela_padrao icon-logo_usa_white"></i></div></header>

    <header class="winetitle-it"><div id="titulo"></div><div id="logo" style="background-color:white"><i class="icon-logo_ita"></i></div></header>
    <header class="winetitle2-it"><div id="titulo"><br></div><div id="logo" style="background-color:white"><i class="icon-logo_ita"></i></div></header>
    <header class="whitelogo-it"><div id="logo" style="float:right"><i class="icon-logo_ita_white"></i></div></header>
    <header class="backlay1-it"><div class="backlay_1-it"><i class="logo_tela_padrao icon-logo_ita_white"></i></div></header>

    <footer class="fim">FIM</footer>
    <footer class="scripturetitle"><small></small></footer>

    <div class="slides">
    </div>
  </div>

  <script src="js/jquery-3.3.1.min.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/transport.js"></script>
  <script>
    Reveal.initialize({
      controls: false,
      progress: false,
      history: false,
      keyboard: true,
      center: true,
      theme: Reveal.getQueryHash().theme,
      transition: 'fade',
      width: 1920,
      height: 1080,
      margin: 0.04,
    });

    (function () {
      var transport = null;
      var pc = null;
      var pairingTimer = null;
      var videoFit = 'contain';
      var videoFullscreen = false;

      var DEFAULT_LOGO_HTML =
        '<section data-background="imagens/fundo.jpg" data-state="show_backlay1">' +
        '<style>.show_backlay1 header.backlay1-pt-br .backlay_1-pt-br{display:block}</style>' +
        '<h1>Maranata</h1><h3>O Senhor Jesus Vem</h3></section>';

      function changeSlide(number) {
        try {
          Reveal.slide(Number(number) || 0);
        } catch (e) {
          console.warn('changeSlide', e);
        }
      }

      function changeBg(fileURL) {
        document.body.style.backgroundImage = 'url(' + fileURL + ')';
      }

      function changeTheme(name) {
        document.getElementById('theme').setAttribute('href', 'css/theme/' + name + '.css');
      }

      function changeFontSize(size) {
        size = Number(size) + 2;
        $('.reveal').css('font-size', size + 'vw');
      }

      function applyVideoStyles() {
        var root = document.querySelector('.reveal');
        if (root) {
          root.setAttribute('data-video-fit', videoFit);
          root.classList.toggle('video-fs-active', !!videoFullscreen);
        }
        document.querySelectorAll('.slides video, .slides .proj-video').forEach(function (v) {
          v.setAttribute('playsinline', '');
          v.style.objectFit = videoFit;
          var section = v.closest('section');
          if (section) {
            section.classList.toggle('video-fullscreen', !!videoFullscreen);
            section.classList.add('video-slide');
          }
          if (videoFullscreen) {
            v.style.maxWidth = 'none';
            v.style.maxHeight = 'none';
            v.style.width = '100%';
            v.style.height = '100%';
          } else {
            v.style.maxWidth = '100%';
            v.style.maxHeight = '85vh';
            v.style.width = '';
            v.style.height = '';
          }
        });
      }

      function reloadReveal(htmlslides, slideIndex) {
        hideStream();
        $('.reveal').removeClass('cleared');
        setPairingVisible(false);
        $('.slides').html(htmlslides || '');
        try {
          Reveal.sync();
        } catch (e) {
          console.warn('Reveal.sync', e);
        }
        changeSlide(slideIndex != null ? slideIndex : 0);
        applyVideoStyles();
      }

      function showDefaultLogo() {
        reloadReveal(DEFAULT_LOGO_HTML, 0);
      }

      function setPairingVisible(visible) {
        var el = document.getElementById('pairingOverlay');
        el.classList.toggle('visible', !!visible);
      }

      function applyDisplayProfile(profile) {
        var map = { '720p': [1280, 720], '1080p': [1920, 1080] };
        var size = map[profile] || map['1080p'];
        Reveal.configure({ width: size[0], height: size[1] });
        document.querySelector('.reveal').setAttribute('data-display-profile', profile);
      }

      function refreshPairing() {
        fetch('/api/pairing')
          .then(function (r) { return r.json(); })
          .then(function (info) {
            var img = document.getElementById('pairingQr');
            if (info.qrDataUrl) img.src = info.qrDataUrl;
            document.getElementById('pairingIp').textContent =
              (info.ips && info.ips.length ? info.ips.join('  ·  ') : 'Aguardando IP…');
            document.getElementById('pairingPin').textContent = info.pin
              ? 'PIN: ' + info.pin
              : '';
            document.getElementById('pairingHost').textContent =
              (info.hostname ? info.hostname + '  ·  ' : '') +
              'porta ' + info.port;
            applyDisplayProfile(info.displayProfile || '1080p');
          })
          .catch(function () {});
      }

      function handleMessage(data) {
        if (!data || data.host !== 'projection-html5') return;
        var fn = data.function;
        if (fn === 'reloadReveal') reloadReveal(data.data, 0);
        if (fn === 'changeSlide') changeSlide(data.data);
        if (fn === 'changeBg') changeBg(data.data);
        if (fn === 'changeTheme') changeTheme(data.data);
        if (fn === 'changeFontSize') changeFontSize(data.data);
        if (fn === 'clearProjection') {
          $('.reveal').toggleClass('cleared', data.data !== false);
        }
        if (fn === 'showLogo') {
          $('.reveal').removeClass('cleared');
          if (typeof data.data === 'string' && data.data.indexOf('<section') !== -1) {
            reloadReveal(data.data, 0);
          } else {
            showDefaultLogo();
          }
        }
        if (fn === 'showPairing') setPairingVisible(true);
        if (fn === 'hidePairing') setPairingVisible(false);
        if (fn === 'setDisplayProfile') applyDisplayProfile(data.data);
        if (fn === 'setVideoFit') {
          if (data.data) {
            if (data.data.fit) videoFit = data.data.fit;
            if (data.data.fullscreen != null) videoFullscreen = !!data.data.fullscreen;
          }
          applyVideoStyles();
        }
        if (fn === 'playVideo') {
          var v = document.querySelector('.slides video');
          if (data.data && data.data.src) {
            if (!v) {
              reloadReveal(
                '<section class="video-slide"><video class="proj-video" src="' +
                  data.data.src +
                  '" playsinline></video></section>',
                0
              );
              v = document.querySelector('.slides video');
            } else {
              v.src = data.data.src;
            }
          }
          applyVideoStyles();
          if (v) {
            if (data.data && data.data.currentTime != null) v.currentTime = data.data.currentTime;
            v.play().catch(function () {});
          }
        }
        if (fn === 'pauseVideo') {
          var pv = document.querySelector('.slides video');
          if (pv) pv.pause();
        }
        if (fn === 'seekVideo') {
          var sv = document.querySelector('.slides video');
          var t = data.data && data.data.currentTime != null ? data.data.currentTime : data.data;
          if (sv) sv.currentTime = Number(t) || 0;
        }
        if (fn === 'stateSnapshot') {
          var snap = data.data;
          if (snap.displayProfile) applyDisplayProfile(snap.displayProfile);
          if (snap.theme) changeTheme(snap.theme);
          if (snap.fontSize != null) changeFontSize(snap.fontSize);
          if (snap.video) {
            if (snap.video.fit) videoFit = snap.video.fit;
            if (snap.video.fullscreen != null) videoFullscreen = !!snap.video.fullscreen;
          }
          if (snap.slidesHtml) {
            reloadReveal(snap.slidesHtml, snap.slideIndex || 0);
          }
          setPairingVisible(!!snap.pairingVisible && !snap.slidesHtml);
          if (snap.cleared) $('.reveal').addClass('cleared');
          if (snap.logo && !snap.slidesHtml) showDefaultLogo();
        }
        if (fn === 'controlChanged') {
          if (data.data && data.data.pairingVisible) setPairingVisible(true);
          else setPairingVisible(false);
        }
        if (fn === 'webrtc-signal') handleWebRtc(data.data);
        if (fn === 'streamStopped') hideStream();
      }

      window.addEventListener('message', function (event) {
        try {
          handleMessage(JSON.parse(event.data));
        } catch (e) {}
      });

      function setDot(on) {
        var d = document.getElementById('connDot');
        d.className = on ? 'on' : 'off';
      }

      function hideStream() {
        var layer = document.getElementById('remoteVideoLayer');
        layer.classList.remove('active');
        var v = document.getElementById('remoteVideo');
        v.srcObject = null;
        if (pc) {
          pc.close();
          pc = null;
        }
      }

      function ensurePc() {
        if (pc) return pc;
        pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
        });
        pc.ontrack = function (ev) {
          var layer = document.getElementById('remoteVideoLayer');
          var rv = document.getElementById('remoteVideo');
          rv.srcObject = ev.streams[0];
          layer.classList.add('active');
          setPairingVisible(false);
        };
        pc.onicecandidate = function (ev) {
          if (ev.candidate && transport) {
            transport.send('webrtc-signal', { type: 'candidate', candidate: ev.candidate });
          }
        };
        return pc;
      }

      async function handleWebRtc(data) {
        if (!data) return;
        var conn = ensurePc();
        if (data.type === 'offer') {
          await conn.setRemoteDescription(data.sdp);
          var answer = await conn.createAnswer();
          await conn.setLocalDescription(answer);
          transport.send('webrtc-signal', { type: 'answer', sdp: conn.localDescription });
        } else if (data.type === 'candidate' && data.candidate) {
          try {
            await conn.addIceCandidate(data.candidate);
          } catch (e) {}
        }
      }

      function startRemote() {
        if (location.protocol.indexOf('http') !== 0) return;
        transport = new ProjectionTransport({
          role: 'view',
          name: 'projector',
          pin: '',
        });
        fetch('/api/pairing')
          .then(function (r) { return r.json(); })
          .then(function (info) {
            transport.pin = info.pin || '';
            transport.on('open', function () { setDot(true); });
            transport.on('close', function () { setDot(false); });
            transport.on('message', function (msg) { handleMessage(msg); });
            transport.connect();
            refreshPairing();
            setPairingVisible(true);
            pairingTimer = setInterval(refreshPairing, 5000);
          })
          .catch(function () {
            setDot(false);
          });
      }

      $(document).ready(function () {
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(
              JSON.stringify({
                host: 'projection-html5-painel',
                function: 'opened',
                url: window.location.href,
                data: { data: 'ok' },
              }),
              '*'
            );
          } catch (e) {}
        }
        startRemote();
        document.addEventListener('keydown', function (e) {
          if (e.key === 'p' || e.key === 'P') {
            setPairingVisible(true);
            refreshPairing();
          }
        });
      });
    })();
  </script>
</body>
</html>
